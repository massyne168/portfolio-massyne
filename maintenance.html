<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050608">
  <title>MASSYNE — Creative Portfolio</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"></noscript>
  <style>
    :root {
      --ink: #050608;
      --paper: #f5ebd0;
      --muted: #8a8487;
      --red: #c81024;
      --red-bright: #e84d5a;
      --red-dim: #7f011f;
      --glass-blur: 10px;
      --glass-radius: 36px;
      --glass-tint: 0.01;
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-bright: rgba(255, 255, 255, 0.28);
      --glass-shadow:
        0 28px 80px rgba(0, 0, 0, 0.62),
        0 0 90px rgba(127, 1, 31, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        inset 0 -1px 0 rgba(255, 255, 255, 0.06);
      --font-display: "Syne", "Space Grotesk", Arial, sans-serif;
      --font-serif: "DM Serif Display", Georgia, serif;
      --font-body: "Manrope", "Space Grotesk", Arial, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    ::selection { background: var(--red); color: var(--paper); }

    /* ===== Shader R WebGL Background ===== */
    #shader-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    .bg-fallback {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 65% 55% at 50% 25%, rgba(138, 0, 0, 0.24) 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 80% 80%, rgba(127, 1, 31, 0.16) 0%, transparent 60%),
        var(--ink);
    }

    .grain-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ===== Main Shell ===== */
    .maintenance-shell {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 4vw, 48px) clamp(16px, 3vw, 32px);
    }

    /* ===== Liquid Glass Card (blur: 10px | radius: 36px | tint: 1%) ===== */
    .glass-card {
      --mx: 50%;
      --my: 25%;
      position: relative;
      width: min(100%, 540px);
      background: rgba(255, 255, 255, var(--glass-tint));
      backdrop-filter: blur(var(--glass-blur)) saturate(185%) brightness(1.08);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(185%) brightness(1.08);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius);
      box-shadow: var(--glass-shadow);
      padding: clamp(44px, 6vw, 68px) clamp(28px, 5vw, 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(24px, 3.5vw, 34px);
      text-align: center;
      overflow: hidden;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        420px circle at var(--mx) var(--my),
        rgba(255, 255, 255, 0.14),
        rgba(255, 255, 255, 0.02) 45%,
        transparent 75%
      );
      pointer-events: none;
    }

    .glass-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.48), transparent);
      pointer-events: none;
    }

    .glass-card:hover {
      border-color: var(--glass-border-bright);
    }

    /* ===== Logo ===== */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .logo-img {
      width: clamp(96px, 16vw, 132px);
      height: auto;
      filter: drop-shadow(0 0 36px rgba(200, 16, 36, 0.42));
      animation: logo-pulse 5s ease-in-out infinite;
    }

    @keyframes logo-pulse {
      0%, 100% { filter: drop-shadow(0 0 28px rgba(200, 16, 36, 0.35)); }
      50% { filter: drop-shadow(0 0 48px rgba(200, 16, 36, 0.58)); }
    }

    .wordmark {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.9rem, 4.2vw, 2.6rem);
      letter-spacing: -0.07em;
      line-height: 1;
      color: var(--paper);
    }

    .wordmark span {
      color: var(--red-bright);
    }

    /* ===== Status Badge ===== */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: rgba(127, 1, 31, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 100px;
      font: 600 clamp(0.72rem, 1.4vw, 0.82rem) var(--font-mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--paper);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red-bright);
      box-shadow: 0 0 14px var(--red-bright), 0 0 28px var(--red);
      animation: dot-pulse 1.8s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.65; }
    }

    /* ===== Editorial Copy ===== */
    .headline {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.75rem, 3.8vw, 2.45rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: var(--paper);
      margin: 0;
    }

    .headline em {
      display: block;
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      text-transform: none;
      color: var(--red-bright);
      letter-spacing: -0.02em;
      margin-top: 4px;
    }

    .subtext {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: clamp(0.76rem, 1.35vw, 0.86rem);
      line-height: 1.7;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(245, 235, 208, 0.72);
      margin: 0;
      max-width: 400px;
    }

    /* ===== Footer ===== */
    .footer-note {
      width: 100%;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font: 500 clamp(0.68rem, 1.2vw, 0.78rem) var(--font-mono);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245, 235, 208, 0.48);
    }

    /* ===== Entrance ===== */
    .logo-wrap, .status-badge, .headline, .subtext, .footer-note {
      opacity: 0;
      transform: translateY(22px);
      animation: entrance 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    .logo-wrap { animation-delay: 0.08s; }
    .status-badge { animation-delay: 0.18s; }
    .headline { animation-delay: 0.28s; }
    .subtext { animation-delay: 0.38s; }
    .footer-note { animation-delay: 0.48s; }

    @keyframes entrance {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-wrap, .status-badge, .headline, .subtext, .footer-note {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .logo-img, .status-dot { animation: none; }
      #shader-canvas { display: none !important; }
    }

    @media (max-width: 420px) {
      .glass-card {
        padding: 36px 22px;
        gap: 22px;
      }
    }
  </style>
</head>
<body>
  <canvas id="shader-canvas" aria-hidden="true"></canvas>
  <div class="bg-fallback" aria-hidden="true"></div>
  <div class="grain-overlay" aria-hidden="true"></div>

  <main class="maintenance-shell" role="main">
    <article class="glass-card" id="glassCard">
      <div class="logo-wrap">
        <img
          class="logo-img"
          src="https://pub-c78e3daeef5841a99f5ce6ad0ebd9fdf.r2.dev/images/optimized/flame-metal-logo-480.webp"
          alt="MASSYNE logo"
          width="120"
          height="60"
        >
        <div class="wordmark">MASSYNE<span>.</span></div>
      </div>

      <div class="status-badge" aria-label="Maintenance mode active">
        <span class="status-dot" aria-hidden="true"></span>
        SYSTEM MAINTENANCE
      </div>

      <h1 class="headline">SOMETHING NEW<em>is coming.</em></h1>

      <p class="subtext">WE'RE CURRENTLY CRAFTING A NEW EXPERIENCE.</p>

      <footer class="footer-note">MASSYNE — CREATIVE PORTFOLIO</footer>
    </article>
  </main>

  <script>
    // Liquid Glass cursor sheen
    (() => {
      const card = document.getElementById('glassCard');
      if (!card) return;
      card.addEventListener('pointermove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty('--mx', x.toFixed(1) + '%');
        card.style.setProperty('--my', y.toFixed(1) + '%');
      });
    })();

    // Redirect back to portfolio if maintenance mode is off or owner is already authenticated
    (() => {
      fetch('/api/maintenance-auth', {
        method: 'GET',
        credentials: 'same-origin',
        cache: 'no-store'
      })
        .then((res) => (res.ok ? res.json() : null))
        .then((data) => {
          if (data && (!data.maintenance || data.authenticated)) {
            window.location.replace('/');
          }
        })
        .catch(() => {});
    })();

    // Shader R WebGL Background
    (() => {
      const canvas = document.getElementById('shader-canvas');
      const gl = canvas.getContext('webgl', {
        alpha: true,
        antialias: false,
        depth: false,
        stencil: false,
        powerPreference: 'high-performance'
      });

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!gl || reducedMotion) {
        canvas.style.display = 'none';
        return;
      }

      const vertexShaderSource = `
        attribute vec2 a_position;
        varying vec2 v_uv;
        void main() {
          v_uv = a_position * 0.5 + 0.5;
          gl_Position = vec4(a_position, 0.0, 1.0);
        }
      `;

      const fragmentShaderSource = `
        precision highp float;
        varying vec2 v_uv;

        uniform float u_time;
        uniform vec2 u_resolution;
        uniform float u_scale;
        uniform float u_distortion;
        uniform float u_grain;
        uniform float u_contrast;
        uniform float u_speed;
        uniform vec3 u_colorA;
        uniform vec3 u_colorB;
        uniform vec3 u_colorC;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          float a = hash(i);
          float b = hash(i + vec2(1.0, 0.0));
          float c = hash(i + vec2(0.0, 1.0));
          float d = hash(i + vec2(1.0, 1.0));
          return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
        }

        float fbm(vec2 p) {
          float value = 0.0;
          float amplitude = 0.5;
          for (int i = 0; i < 5; i++) {
            value += amplitude * noise(p);
            p *= 2.0;
            amplitude *= 0.5;
          }
          return value;
        }

        vec2 distort(vec2 p, float time) {
          float n1 = fbm(p * 0.5 + time * 0.1);
          float n2 = fbm(p * 0.7 + time * 0.13 + 100.0);
          float n3 = fbm(p * 1.2 + time * 0.07 + 200.0);
          vec2 d = vec2(n1 - n2, n2 - n3) * u_distortion;
          return p + d;
        }

        float grain(vec2 p) {
          return hash(p) * 2.0 - 1.0;
        }

        void main() {
          vec2 uv = v_uv;
          vec2 center = vec2(0.5);
          vec2 p = (uv - center) * u_scale + center;
