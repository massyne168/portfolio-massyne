  <!-- Silver sub-label -->
  <text x="50%" y="88" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, serif" font-size="10" letter-spacing="5"
        fill="#A0A0A0">DESIGN</text>
</svg>
